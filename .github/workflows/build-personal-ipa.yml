name: Build personal IPA

on:
  push:
    branches: [codex/ipa-3.0.0]

permissions:
  contents: read

jobs:
  archive:
    if: ${{ !contains(github.event.head_commit.message, '[tests only]') }}
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check Xcode and the iPhone SDK
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
      - name: Archive EhPanda for iPhone and iPad
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project EhPanda.xcodeproj \
            -scheme EhPanda \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/EhPanda.xcarchive" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -onlyUsePackageVersionsFromResolvedFile \
            CURRENT_PROJECT_VERSION=166 \
            CODE_SIGN_IDENTITY= CODE_SIGN_ENTITLEMENTS= \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            GCC_OPTIMIZATION_LEVEL=s SWIFT_OPTIMIZATION_LEVEL=-O
      - name: Package and verify the unsigned IPA
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/EhPanda.xcarchive/Products/Applications/EhPanda.app"
          version="$(plutil -extract CFBundleShortVersionString raw -o - "$app/Info.plist")"
          build="$(plutil -extract CFBundleVersion raw -o - "$app/Info.plist")"
          [[ "$version" == 3.0.0 ]]
          [[ "$build" == 166 ]]
          output="$RUNNER_TEMP/ipa/EhPanda-$version-build$build.ipa"
          bash actions-tool/package-channel.sh "$app" github "$output"
          unzip -tq "$output"
          test -x "$app/$(plutil -extract CFBundleExecutable raw -o - "$app/Info.plist")"
      - uses: actions/upload-artifact@v7
        with:
          name: EhPanda-3.0.0-build166-unsigned
          path: ${{ runner.temp }}/ipa/EhPanda-3.0.0-build166.ipa
          if-no-files-found: error
          retention-days: 7

  download-regressions:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test download recovery and image dispatch
        run: |
          set -euo pipefail
          plan=AppPackage/Tests/FeatureTests.xctestplan
          jq '.testTargets |= map(select(.target.name == "DownloadsFeatureTests" or .target.name == "NetworkingFeatureTests"))' \
            "$plan" > "$RUNNER_TEMP/FeatureTests.xctestplan"
          cp "$RUNNER_TEMP/FeatureTests.xctestplan" "$plan"
          xcodebuild test \
            -project EhPanda.xcodeproj \
            -scheme EhPanda \
            -testPlan FeatureTests \
            -destination 'platform=iOS Simulator,name=iPhone Air,OS=27.0' \
            -resultBundlePath "$RUNNER_TEMP/DownloadRegressions.xcresult" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -onlyUsePackageVersionsFromResolvedFile \
            -only-testing:DownloadsFeatureTests/DownloadImageParsingTests \
            -only-testing:DownloadsFeatureTests/DownloadPageTransferProgressTests \
            -only-testing:NetworkingFeatureTests/ImageRequestBaselineTests
      - name: Show result summary
        if: always()
        run: |
          result="$RUNNER_TEMP/DownloadRegressions.xcresult"
          if [[ -d "$result" ]]; then
            xcrun xcresulttool get test-results summary --path "$result"
          fi
